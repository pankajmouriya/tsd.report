[project]
name = "the-security-diff-pipeline"
version = "0.1.0"
description = "Evidence pipeline for The Security Diff"
requires-python = ">=3.13,<3.15"
dependencies = [
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "pydantic>=2.12,<3",
  "truststore>=0.10,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pyyaml>=6.0,<7",
  "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/pipeline"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
