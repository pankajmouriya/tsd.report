name: Validate and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  queue: max

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TSD_NEWSLETTER_SIGNUP_ENABLED: 'true'
      BUTTONDOWN_USERNAME: tsd-test
      TSD_PUBLICATION_CONTACT_URL: mailto:privacy@example.test
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.21'
          enable-cache: true
      - run: npm ci
      - run: uv sync --locked
      - run: npm run lint:pipeline
      - run: npm run test:pipeline
      - run: npm run check
      - run: npm test
      - run: npm run validate:fixture
      - run: npm run build:fixture
      - run: npm run newsletter:preview -- --mode fixture
      - run: npm run check:links
      - name: Retain newsletter preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: newsletter-preview
          path: dist/newsletter-preview.html
          if-no-files-found: error

  secret-scan:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.TSD_PREVIEW_ENABLED == 'true'
    needs: [quality, secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TSD_NEWSLETTER_SIGNUP_ENABLED: 'true'
      BUTTONDOWN_USERNAME: tsd-test
      TSD_PUBLICATION_CONTACT_URL: mailto:privacy@example.test
    environment:
      name: preview
      url: https://pr-${{ github.event.pull_request.number }}.${{ vars.CLOUDFLARE_PROJECT_NAME }}.pages.dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build:fixture
      - run: npm run newsletter:preview -- --mode fixture
      - name: Deploy PR preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npx --no-install wrangler pages deploy dist --project-name "$CLOUDFLARE_PROJECT_NAME" --branch "pr-$PR_NUMBER"
      - name: Check preview
        env:
          PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}.${{ vars.CLOUDFLARE_PROJECT_NAME }}.pages.dev
        run: curl --fail --silent --show-error --retry 24 --retry-delay 5 --retry-max-time 120 --retry-all-errors "$PREVIEW_URL/"

  deploy-production:
    if: github.event_name == 'push' && vars.TSD_PRODUCTION_ENABLED == 'true'
    needs: [quality, secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run test:content-environments
      - run: npm run validate:production
      - run: npm run build:production
        env:
          TSD_NEWSLETTER_SIGNUP_ENABLED: ${{ vars.TSD_NEWSLETTER_SIGNUP_ENABLED }}
          BUTTONDOWN_USERNAME: ${{ vars.BUTTONDOWN_USERNAME }}
          TSD_PUBLICATION_CONTACT_URL: ${{ vars.TSD_PUBLICATION_CONTACT_URL }}
      - run: npm run check:links
      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: npx --no-install wrangler pages deploy dist --project-name "$CLOUDFLARE_PROJECT_NAME" --branch main
      - name: Check production project
        env:
          PRODUCTION_URL: https://${{ vars.CLOUDFLARE_PROJECT_NAME }}.pages.dev
        run: curl --fail --silent --show-error --retry 24 --retry-delay 5 --retry-max-time 120 --retry-all-errors "$PRODUCTION_URL/"

  send-newsletter:
    needs: deploy-production
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.TSD_PRODUCTION_ENABLED == 'true' &&
      vars.TSD_NEWSLETTER_SIGNUP_ENABLED == 'true' &&
      vars.TSD_NEWSLETTER_SEND_ENABLED == 'true' &&
      needs.deploy-production.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    concurrency:
      group: newsletter-production
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Queue approved newsletter
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: npm run newsletter:send

  setup-cloudflare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Create Direct Upload Pages project when absent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          test -n "$CLOUDFLARE_PROJECT_NAME"
          if npx --no-install wrangler pages project list --json | jq -e --arg project "$CLOUDFLARE_PROJECT_NAME" '.[] | select(.name == $project)' >/dev/null; then
            echo "Pages project $CLOUDFLARE_PROJECT_NAME already exists."
          else
            npx --no-install wrangler pages project create "$CLOUDFLARE_PROJECT_NAME" --production-branch main
          fi
