name: Propose incident summary
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Content-only automation/incident-SLUG-rN branch prepared by Codex
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
  actions: write
concurrency:
  group: incident-propose-${{ inputs.branch }}
  cancel-in-progress: false
jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.21'
      - run: uv sync --locked
      - env:
          GH_TOKEN: ${{ github.token }}
          INCIDENT_BRANCH: ${{ inputs.branch }}
        run: uv run --locked python -m pipeline.incidents.cli propose --branch "$INCIDENT_BRANCH"
