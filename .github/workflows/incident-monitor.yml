name: Monitor incident sources
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: incident-monitor
  cancel-in-progress: false
jobs:
  discover:
    if: github.event_name == 'workflow_dispatch' || vars.TSD_INCIDENT_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.21'
      - run: uv sync --locked
      - name: Restore the last successful checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p retained
          previous="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow incident-monitor.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$previous" ]; then
            gh run download "$previous" --repo "$GITHUB_REPOSITORY" --name incident-monitor-state --dir retained
          fi
      - name: Collect leads without generating editorial copy
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python -m pipeline.incidents.cli discover --state retained/state.json --run-dir artifacts/incident-monitor --update-queue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: incident-monitor-state
          path: retained/state.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: incident-source-evidence
          path: artifacts/incident-monitor
          retention-days: 90
          if-no-files-found: warn
