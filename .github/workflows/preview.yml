name: Preview

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: preview-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  eligibility:
    if: >-
      vars.TSD_PREVIEW_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      number: ${{ steps.pr.outputs.number }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - name: Check out trusted workflow revision, never PR code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Reject stale, closed, ambiguous, and fork PRs
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_control.py preview
      - name: Require implemented preview controls before entering the environment
        run: python3 .github/scripts/release_control.py require preview

  deploy-preview:
    needs: eligibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: preview
      url: https://pr-${{ needs.eligibility.outputs.number }}.tsd-report-preview.pages.dev
    defaults:
      run:
        working-directory: trusted-control
    env:
      ARTIFACT_DIRECTORY: ${{ github.workspace }}/downloaded
      DEPLOY_DIRECTORY: ${{ github.workspace }}/deploy-dist
      OUTPUT_DIRECTORY: ${{ github.workspace }}/deploy-dist
      EXPECTED_SOURCE_SHA: ${{ needs.eligibility.outputs.sha }}
      EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
      ALLOWED_CONTENT_MODES: fixture,candidate
      HOST_VISIBILITY: noindex
      POLICY_MODE: replace
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted-control
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: trusted-control/.node-version
      - run: npm ci --ignore-scripts
      - run: python3 .github/scripts/release_control.py require preview
      - name: Download only the triggering run's artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: preview-dist-${{ needs.eligibility.outputs.sha }}
          path: downloaded
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Validate archive before safe extraction using trusted code
        id: artifact
        run: npm run verify:artifact -- "$ARTIFACT_DIRECTORY/site.tar"
      - name: Replace PR policy with trusted policy and verify static output
        env:
          CONTENT_MODE: ${{ steps.artifact.outputs.mode }}
        run: |
          case "$CONTENT_MODE" in fixture|candidate) ;; *) exit 1 ;; esac
          rm -f "$DEPLOY_DIRECTORY/_headers" "$DEPLOY_DIRECTORY/_redirects"
          cp public/_headers "$DEPLOY_DIRECTORY/_headers"
          if [ -f public/_redirects ]; then cp public/_redirects "$DEPLOY_DIRECTORY/_redirects"; fi
          npm run verify:build
      - name: Recheck PR state immediately before upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_control.py preview
      - name: Deploy to isolated preview project only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ needs.eligibility.outputs.number }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --no-install wrangler pages deploy "$DEPLOY_DIRECTORY" --project-name tsd-report-preview --branch "pr-$PR_NUMBER"
      - name: Check hosted preview and record URL
        env:
          CONTENT_MODE: ${{ steps.artifact.outputs.mode }}
          DEPLOY_BASE_URL: https://pr-${{ needs.eligibility.outputs.number }}.tsd-report-preview.pages.dev
          SMOKE_TARGET: preview
          RELEASE_MANIFEST_PATH: ${{ github.workspace }}/downloaded/release-manifest.json
        run: |
          npm run smoke:deployment
          printf 'Preview: %s\nSource: %s\n' "$DEPLOY_BASE_URL" "$EXPECTED_SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
